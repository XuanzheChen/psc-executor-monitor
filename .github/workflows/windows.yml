name: Windows monitor tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monitor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GUI executable
        shell: powershell
        run: .\build.ps1
      - name: Validate PowerShell 5.1 and monitor states
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\PSC-Monitor.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ("PowerShell parse errors: " + ($errors -join "; ")) }
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\PSC-Monitor.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Monitor selftest failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-registry-monitor.ps1
          if ($LASTEXITCODE -ne 0) { throw "Registry reader tests failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-project-marquee.ps1
          if ($LASTEXITCODE -ne 0) { throw "Project path marquee tests failed" }
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\test-project-colors.ps1
          if ($LASTEXITCODE -ne 0) { throw "Project path drawing color tests failed" }
      - name: Test bootstrap from a fresh checkout
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-first-run.ps1
          if ($LASTEXITCODE -ne 0) { throw "Fresh checkout bootstrap failed" }
      - name: Test compiled launcher
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\PSC-Monitor-Neon.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Launcher failed with exit code $($p.ExitCode)" }
